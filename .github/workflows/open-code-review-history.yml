name: OpenCodeReview History

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Historical pull request number
        required: true
        type: string
      publish_summary:
        description: Publish or update a summary comment on the pull request
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: open-code-review-history
  cancel-in-progress: false

jobs:
  review:
    name: Review historical pull request
    if: vars.OCR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: open-code-review-history-${{ github.run_id }}
      base_sha: ${{ steps.pull-request.outputs.base_sha }}
      head_sha: ${{ steps.pull-request.outputs.head_sha }}
      number: ${{ steps.pull-request.outputs.number }}
      state: ${{ steps.pull-request.outputs.state }}
      url: ${{ steps.pull-request.outputs.url }}

    steps:
      - name: Resolve pull request range
        id: pull-request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const rawNumber = process.env.INPUT_PR_NUMBER;
            if (!/^[1-9][0-9]*$/.test(rawNumber)) {
              core.setFailed(`Invalid pull request number: ${rawNumber}`);
              return;
            }

            const pullNumber = Number(rawNumber);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            core.setOutput('number', String(pullNumber));
            core.setOutput('base_sha', pull.base.sha);
            core.setOutput('head_sha', pull.head.sha);
            core.setOutput('state', pull.merged_at ? 'merged' : pull.state);
            core.setOutput('url', pull.html_url);
            core.info(`PR #${pullNumber}: ${pull.base.sha}..${pull.head.sha}`);

      - name: Checkout historical base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pull-request.outputs.base_sha }}
          fetch-depth: 0

      - name: Prepare trusted review inputs
        env:
          BASE_SHA: ${{ steps.pull-request.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"
          actual_head="$(git rev-parse "refs/remotes/origin/pr/${PR_NUMBER}")"
          if [[ "$actual_head" != "$HEAD_SHA" ]]; then
            echo "::error::Fetched PR head $actual_head does not match expected $HEAD_SHA"
            exit 1
          fi

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "::error::PR base $BASE_SHA is not an ancestor of head $HEAD_SHA"
            exit 1
          fi

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          if ! git cat-file -e origin/main:.opencodereview/rule.json; then
            echo "::error::Missing .opencodereview/rule.json on origin/main"
            exit 1
          fi
          git show origin/main:.opencodereview/rule.json \
            > "${RUNNER_TEMP}/ocr-history-rule.json"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            > "${RUNNER_TEMP}/ocr-history-files.txt"

          file_count="$(wc -l < "${RUNNER_TEMP}/ocr-history-files.txt" | tr -d ' ')"
          echo "Reviewing $file_count changed file(s) from $BASE_SHA to $HEAD_SHA"

      - name: Install OpenCodeReview
        shell: bash
        run: |
          npm install --global "@alibaba-group/open-code-review@1.11.1"
          ocr version

      - name: Configure OpenCodeReview
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$OCR_LLM_URL" || -z "$OCR_LLM_TOKEN" || -z "$OCR_LLM_MODEL" ]]; then
            echo "::error::OpenCodeReview model configuration is incomplete"
            exit 1
          fi

          normalized_protocol="$(printf '%s' "$OCR_USE_ANTHROPIC" | tr '[:upper:]' '[:lower:]')"
          case "$normalized_protocol" in
            true)
              use_anthropic="true"
              protocol="anthropic"
              ;;
            false)
              use_anthropic="false"
              protocol="openai"
              ;;
            *)
              echo "::error::OCR_LLM_USE_ANTHROPIC must be true or false"
              exit 1
              ;;
          esac

          ocr config unset provider || true
          ocr config set llm.auth_token ""
          ocr config set llm.url "$OCR_LLM_URL"
          ocr config set llm.model "$OCR_LLM_MODEL"
          ocr config set llm.use_anthropic "$use_anthropic"
          ocr config set llm.protocol "$protocol"
          ocr config set llm.auth_token_cmd 'printf "%s" "$OCR_LLM_TOKEN"'
          ocr config set llm.extra_body '{"thinking":{"type":"disabled"}}'
          ocr config set language Chinese

      - name: Review historical range
        id: review
        timeout-minutes: 35
        env:
          BASE_SHA: ${{ steps.pull-request.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
        shell: bash
        run: |
          set +e
          ocr review \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --format json \
            --audience agent \
            --concurrency 2 \
            --rule "${RUNNER_TEMP}/ocr-history-rule.json" \
            > "${RUNNER_TEMP}/ocr-history-result.json" \
            2> "${RUNNER_TEMP}/ocr-history-stderr.log"
          exit_code=$?
          set -e

          if [[ "$exit_code" -eq 0 ]] && \
            ! jq -e . "${RUNNER_TEMP}/ocr-history-result.json" > /dev/null; then
            echo "::error::OpenCodeReview returned invalid JSON"
            exit_code=1
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload historical review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: open-code-review-history-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ocr-history-result.json
            ${{ runner.temp }}/ocr-history-files.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on OpenCodeReview error
        if: steps.review.outputs.exit_code != '0'
        env:
          OCR_EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        shell: bash
        run: |
          echo "::error::OpenCodeReview exited with code ${OCR_EXIT_CODE}; inspect the uploaded artifact"
          exit "${OCR_EXIT_CODE}"

  publish:
    name: Publish historical review summary
    needs: review
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download historical review artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.review.outputs.artifact_name }}
          path: ${{ runner.temp }}/ocr-history

      - name: Publish historical review summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_SHA: ${{ needs.review.outputs.base_sha }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          PR_NUMBER: ${{ needs.review.outputs.number }}
          PR_STATE: ${{ needs.review.outputs.state }}
          PR_URL: ${{ needs.review.outputs.url }}
          PUBLISH_SUMMARY: ${{ inputs.publish_summary }}
          RESULT_PATH: ${{ runner.temp }}/ocr-history/ocr-history-result.json
        with:
          script: |
            const fs = require('fs');
            let result;
            try {
              result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
            } catch (error) {
              throw new Error(`Unable to read OpenCodeReview result: ${error.message}`);
            }
            const pullNumber = Number(process.env.PR_NUMBER);
            const marker = `<!-- ocr-history-pr-${pullNumber} -->`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const neutralize = (value) => String(value ?? '')
              .replaceAll('@', '@\u200b')
              .replaceAll('<!--', '&lt;!--');
            const escapeHtml = (value) => String(value ?? '')
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;');
            const severityRank = { critical: 0, high: 1, medium: 2, low: 3 };
            const allowedCategories = new Set([
              'bug',
              'security',
              'performance',
              'maintainability',
              'test',
              'style',
              'documentation',
              'other',
            ]);
            const findings = [...(result.comments ?? [])].sort((left, right) =>
              (severityRank[left.severity] ?? 4) - (severityRank[right.severity] ?? 4));
            const summary = result.summary ?? {};
            const asCount = (value) => Number.isSafeInteger(value) && value >= 0 ? value : 0;
            const asLine = (value) => Number.isSafeInteger(value) && value > 0 ? value : '?';

            let body = `${marker}\n## OpenCodeReview 历史审查\n\n`;
            body += `- PR：[#${pullNumber}](${process.env.PR_URL})（${process.env.PR_STATE}）\n`;
            body += `- 精确范围：\`${process.env.BASE_SHA.slice(0, 12)}..${process.env.HEAD_SHA.slice(0, 12)}\`\n`;
            body += `- 模型：<code>${escapeHtml(neutralize(result.llm?.model || 'unknown'))}</code>\n`;
            body += `- 已审查文件：${asCount(summary.files_reviewed)}\n`;
            body += `- 发现问题：${findings.length}\n`;
            body += `- Token：${asCount(summary.total_tokens)}（输入 ${asCount(summary.input_tokens)}，输出 ${asCount(summary.output_tokens)}）\n`;
            body += `- [查看工作流与原始 Artifact](${runUrl})\n\n`;
            body += '> 这是对已合并历史范围的辅助审查；结论需要人工复核，真实问题应通过新的独立 PR 修复。\n';

            if (findings.length === 0) {
              body += '\n未发现需要报告的问题。\n';
            } else {
              body += '\n### 审查意见\n';
              let included = 0;
              for (const finding of findings) {
                const path = escapeHtml(neutralize(finding.path || 'unknown'));
                const start = asLine(finding.start_line);
                const endLine = asLine(finding.end_line);
                const end = endLine !== '?' && endLine !== start ? `-${endLine}` : '';
                const severity = Object.hasOwn(severityRank, finding.severity)
                  ? finding.severity
                  : 'unknown';
                const category = allowedCategories.has(finding.category)
                  ? finding.category
                  : 'other';
                const content = escapeHtml(neutralize(finding.content || '')).replaceAll('\n', '<br>');
                let section = `\n#### ${severity.toUpperCase()} · ${category}\n\n`;
                section += `<code>${path}:${start}${end}</code>\n\n`;
                section += `<blockquote>${content}</blockquote>\n`;
                if (finding.suggestion_code) {
                  section += `\n<details><summary>建议修改</summary>\n\n<pre><code>${escapeHtml(finding.suggestion_code)}</code></pre>\n\n</details>\n`;
                }

                if (body.length + section.length > 58000) {
                  break;
                }
                body += section;
                included += 1;
              }
              if (included < findings.length) {
                body += `\n另有 ${findings.length - included} 条意见因评论长度限制仅保存在 Artifact 中。\n`;
              }
            }

            await core.summary.addRaw(body).write();
            if (process.env.PUBLISH_SUMMARY !== 'true') {
              core.info('Summary publishing disabled; result is available in the job summary.');
              return;
            }

            const existingComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = existingComments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated historical review comment ${existing.id}.`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body,
              });
              core.info(`Created historical review comment ${created.id}.`);
            }
